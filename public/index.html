<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashChat - Real-time Chat App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Login Modal -->
    <div class="login-modal" id="login-modal">
      <div class="login-container">
        <h2>Welcome to FlashChat</h2>
        <p>Connect with people around the world in real-time</p>
        
        <form id="join-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter a username" required>
          </div>
          
          <div class="form-group">
            <label for="room">Select Room</label>
            <select id="room" required>
              <option value="general">General</option>
              <option value="tech">Tech</option>
              <option value="random">Random</option>
            </select>
          </div>
          
          <button type="submit" class="btn join-btn">Join Chat</button>
        </form>
      </div>
    </div>

    <!-- Main Chat Interface -->
    <div class="chat-container" id="chat-container">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="logo">
          <i class="fas fa-bolt"></i> FlashChat
        </div>
        
        <div class="room-info">
          <h3 id="room-name">Room Name</h3>
          <div class="online-users">
            <div class="online-indicator"></div>
            <span id="online-count">0</span> online
          </div>
        </div>
        
        <div class="user-list-container">
          <h4>Active Users</h4>
          <ul id="users-list" class="users-list"></ul>
        </div>
        
        <div class="room-selector">
          <h4>Change Room</h4>
          <div class="room-buttons">
            <button class="room-btn" data-room="general">General</button>
            <button class="room-btn" data-room="tech">Tech</button>
            <button class="room-btn" data-room="random">Random</button>
          </div>
        </div>
      </div>
      
      <!-- Chat Main Area -->
      <div class="chat-main">
        <div class="chat-messages" id="chat-messages">
          <!-- Messages will be added here dynamically -->
        </div>
        
        <div class="typing-indicator" id="typing-indicator">
          <span id="typing-text"></span>
          <div class="typing-dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
        
        <div class="message-input-container">
          <form id="message-form">
            <input type="text" id="message-input" placeholder="Type a message...">
            <button type="submit" class="send-btn">
              <i class="fas fa-paper-plane"></i>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
  
  <script src="/socket.io/socket.io.js"></script>
  <script src="main.js"></script>
</body>
</html>
